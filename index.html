<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRAK MOTION GPS Inventory Scanner</title>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
*{box-sizing:border-box}
body{margin:0;padding:15px;font-family:Arial,sans-serif;background:#f1f5f3;color:#17221c}
.container{max-width:650px;margin:auto}
.header{background:#087b43;color:white;padding:22px;border-radius:16px;text-align:center;margin-bottom:15px}
.header h1{margin:0;font-size:24px}
.card{background:white;padding:18px;border-radius:15px;margin-bottom:15px;box-shadow:0 3px 10px #0000000d}
h2{font-size:18px;margin-top:0}
label{display:block;font-weight:bold;margin:14px 0 6px}
input,select,textarea,button{width:100%;padding:12px;border:1px solid #cbd5ce;border-radius:10px;font-size:16px}
textarea{min-height:75px}
button{border:0;font-weight:bold;cursor:pointer;margin-top:10px}
button:disabled{opacity:.6}
.primary{background:#087b43;color:white}
.secondary{background:#e7f3eb;color:#07532d}
.scanner-box{width:100%;min-height:240px;border:2px dashed #087b43;border-radius:12px;overflow:hidden}
.scan-status{padding:10px;background:#f1f5f2;border-radius:8px;margin-top:8px;font-size:14px;overflow-wrap:anywhere}
.message{display:none;padding:12px;border-radius:9px;margin-top:10px;overflow-wrap:anywhere}
.success{display:block;background:#e4f7eb;color:#08602f}
.error{display:block;background:#ffe7e7;color:#a00000}
.debug{background:#101714;color:#9cffc1;padding:12px;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}
.small{font-size:12px;color:#66736b;margin-top:5px}
</style>
</head>

<body>
<div class="container">

<header class="header">
<h1>TRAK MOTION GPS</h1>
<p>GPS Inventory Scanner</p>
</header>

<section class="card">
<h2>Camera Scanner</h2>
<label for="cameraSelect">Camera / Lens</label>
<select id="cameraSelect"><option value="">Loading cameras...</option></select>
<div id="scanner" class="scanner-box"></div>
<div id="scannerStatus" class="scan-status">Preparing scanner...</div>
<button class="primary" id="startButton" type="button">Start Camera</button>
<button class="secondary" id="stopButton" type="button">Stop Camera</button>
</section>

<section class="card">
<h2>GPS Device</h2>
<label for="imei">IMEI Number</label>
<input id="imei" type="text" inputmode="numeric" autocomplete="off" placeholder="Scan GPS QR code">
<div class="small">Scan the square QR code on your GPS device.</div>
</section>

<section class="card">
<h2>SIM Information</h2>
<label for="sim">SIM Number — Digits Only</label>
<input id="sim" type="text" inputmode="numeric" autocomplete="off" placeholder="Scan SIM QR/barcode">
<div class="small">Only digits from the simNo field are extracted.</div>
</section>

<section class="card">
<h2>Device Details</h2>

<label for="model">Device Model</label>
<select id="model">
<option value="BR05 M">BR05 M</option>
<option value="BR05">BR05</option>
<option value="V5">V5</option>
<option value="SK05">SK05</option>
<option value="OTHER">OTHER</option>
</select>

<label for="relay">Relay</label>
<select id="relay">
<option value="12V">12V</option>
<option value="24V">24V</option>
</select>

<label for="deviceStatus">Device Status</label>
<select id="deviceStatus">
<option value="In Stock">In Stock</option>
<option value="Delivered">Delivered</option>
<option value="Installed">Installed</option>
</select>

<label for="simStatusSelect">SIM Status</label>
<select id="simStatusSelect">
<option value="Active">Active</option>
<option value="Inactive">Inactive</option>
<option value="Closed">Closed</option>
<option value="Safe custody">Safe custody</option>
</select>

<label for="lockingStatusSelect">Locking Status</label>
<select id="lockingStatusSelect">
<option value="Not locked">Not locked</option>
<option value="locked">locked</option>
</select>

<label for="remarks">Remarks</label>
<textarea id="remarks" placeholder="Optional remarks"></textarea>
</section>

<section class="card">
<h2>Save Inventory</h2>
<button id="saveButton" class="primary" type="button">Save to Google Sheets</button>
<button id="nextButton" class="secondary" type="button">Scan Next Device</button>
<div id="save-status" class="message"></div>
</section>

<section class="card">
<h2>Debug Payload</h2>
<div id="debug-payload" class="debug">No data yet.</div>
</section>

</div>

<script>
"use strict";

/* EXISTING APPS SCRIPT WEB APP */
const BACKEND_URL =
"https://script.google.com/macros/s/AKfycbwym184i4Mo9dtZjvbi7UPKCFanL5x-4D4m2yMkp7VOeenjRlzVYj0xPUwPJ5PEALJj/exec";

const $ = id => document.getElementById(id);

let scanner = null;
let scannerRunning = false;
let selectedCameraId = "";
let scanMode = "GPS";
let saving = false;
let scanLocked = false;

/* ---------- SIM NUMBER EXTRACTION ---------- */

function extractSimNumber(text) {
  const value = String(text || "").trim();

  // Extract digits from the simNo XML attribute only.
  const match = value.match(/\bsimNo\s*=\s*["']([^"']*)["']/i);

  if (match) {
    return match[1].replace(/\D/g, "");
  }

  // Plain digits returned by a barcode scanner.
  if (/^\d+$/.test(value)) {
    return value;
  }

  // Plain number followed by one letter, e.g. ...6195U.
  if (/^\d+[A-Za-z]$/.test(value)) {
    return value.replace(/\D/g, "");
  }

  return "";
}

/* ---------- IMEI EXTRACTION ---------- */

function extractImei(text) {
  const value = String(text || "").trim();

  const labelled = value.match(
    /\bIMEI\s*(?:NO\.?)?\s*[:=]?\s*["']?(\d{14,16})/i
  );

  if (labelled) return labelled[1];

  if (/^\d{14,16}$/.test(value)) return value;

  const candidates = value.match(/\d{14,16}/g) || [];
  if (candidates.length === 1) return candidates[0];

  return "";
}

/* ---------- CAMERA LIST ---------- */

async function loadCameras() {
  try {
    const cameras = await Html5Qrcode.getCameras();
    const select = $("cameraSelect");
    select.innerHTML = "";

    if (!cameras || !cameras.length) {
      select.add(new Option("No camera found", ""));
      $("scannerStatus").textContent = "No camera found.";
      return;
    }

    cameras.forEach((camera, index) => {
      select.add(new Option(
        camera.label || "Camera " + (index + 1),
        camera.id
      ));
    });

    const rear = cameras.find(camera =>
      /back|rear|environment/i.test(camera.label || "")
    );

    selectedCameraId = (rear || cameras[0]).id;
    select.value = selectedCameraId;

  } catch (error) {
    $("scannerStatus").textContent =
      "Camera error: " + error.message +
      ". Allow camera permission and use HTTPS.";
  }
}

$("cameraSelect").addEventListener("change", async function() {
  selectedCameraId = this.value;

  if (scannerRunning) {
    await stopScanner();
    await startScanner();
  }
});

/* ---------- START CAMERA ---------- */

async function startScanner() {
  if (scannerRunning) return;

  if (!selectedCameraId) await loadCameras();

  if (!selectedCameraId) {
    $("scannerStatus").textContent = "Select a camera.";
    return;
  }

  try {
    scanner = new Html5Qrcode("scanner");
    scanLocked = false;

    await scanner.start(
      selectedCameraId,
      {
        fps: 10,
        qrbox: { width: 250, height: 250 },
        formatsToSupport: [
          Html5QrcodeSupportedFormats.QR_CODE,
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.CODE_93,
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.ITF,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.UPC_E,
          Html5QrcodeSupportedFormats.DATA_MATRIX,
          Html5QrcodeSupportedFormats.PDF_417
        ]
      },
      decodedText => {
        if (!scanLocked) handleScan(decodedText);
      },
      () => {}
    );

    scannerRunning = true;
    $("scannerStatus").textContent =
      scanMode === "GPS"
        ? "Scanning GPS QR code..."
        : "Scanning SIM QR/barcode...";

  } catch (error) {
    scanner = null;
    scannerRunning = false;
    $("scannerStatus").textContent =
      "Unable to start camera: " + error.message;
  }
}

/* ---------- STOP CAMERA ---------- */

async function stopScanner() {
  const oldScanner = scanner;
  const wasRunning = scannerRunning;

  scanner = null;
  scannerRunning = false;

  if (!oldScanner) return;

  try {
    if (wasRunning) await oldScanner.stop();
  } catch (error) {
    console.log(error);
  }

  try {
    await oldScanner.clear();
  } catch (error) {
    console.log(error);
  }
}

/* ---------- PROCESS QR/BARCODE ---------- */

async function handleScan(decodedText) {
  if (scanLocked) return;
  scanLocked = true;

  const raw = String(decodedText || "").trim();

  try {
    if (scanMode === "GPS") {
      const imei = extractImei(raw);

      if (!imei) {
        $("scannerStatus").textContent =
          "IMEI not identified. Check the QR data and scan again.";
        scanLocked = false;
        return;
      }

      $("imei").value = imei;
      scanMode = "SIM";

      $("scannerStatus").textContent =
        "GPS scanned. Now scan the SIM code.";

      await stopScanner();

      setTimeout(() => {
        scanLocked = false;
        startScanner();
      }, 400);

    } else {
      const simNumber = extractSimNumber(raw);

      if (!simNumber) {
        $("scannerStatus").textContent =
          "SIM number not found. Scan the SIM code again.";
        scanLocked = false;
        return;
      }

      $("sim").value = simNumber;

      $("scannerStatus").textContent =
        "SIM scanned. Digits extracted: " + simNumber;

      await stopScanner();
      scanLocked = false;
    }
  } catch (error) {
    scanLocked = false;
    $("scannerStatus").textContent =
      "Scan error: " + error.message;
  }
}

/* ---------- GET INVENTORY RECORD ---------- */

function getRecord() {
  const simStatusElement =
    document.getElementById("simStatusSelect");

  if (!simStatusElement) {
    throw new Error("SIM Status dropdown was not found.");
  }

  return {
    imei: $("imei").value.trim(),
    sim: $("sim").value.trim(),
    model: $("model").value,
    relay: $("relay").value,
    status: $("deviceStatus").value,
    simStatus: simStatusElement.value,
    lockingStatus: $("lockingStatusSelect").value,
    remarks: $("remarks").value.trim()
  };
}

/* ---------- DEBUG ---------- */

function showDebug(record) {
  $("debug-payload").textContent =
    JSON.stringify(record, null, 2);
}

/* ---------- VALIDATION ---------- */

function validateRecord(record) {
  if (!/^\d{14,16}$/.test(record.imei)) {
    return "IMEI must contain 14–16 digits.";
  }

  if (!/^\d+$/.test(record.sim)) {
    return "SIM number must contain digits only.";
  }

  if (!record.model) return "Device Model is required.";
  if (!record.relay) return "Relay is required.";
  if (!record.status) return "Device Status is required.";

  if (![
    "Active", "Inactive", "Closed", "Safe custody"
  ].includes(record.simStatus)) {
    return "Select a valid SIM Status.";
  }

  if (!["locked", "Not locked"].includes(record.lockingStatus)) {
    return "Select a valid Locking Status.";
  }

  return "";
}

/* ---------- SAVE TO GOOGLE SHEETS ---------- */

async function saveRecord() {
  if (saving) return;

  saving = true;
  $("saveButton").disabled = true;
  $("saveButton").textContent = "Saving...";
  $("save-status").className = "message";

  try {
    const record = getRecord();
    showDebug(record);

    const error = validateRecord(record);

    if (error) {
      showMessage("save-status", error, true);
      return;
    }

    const response = await fetch(BACKEND_URL, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify(record)
    });

    const responseText = await response.text();
    let result;

    try {
      result = JSON.parse(responseText);
    } catch {
      throw new Error(
        "Invalid server response. Check Apps Script deployment and URL. " +
        responseText.slice(0, 250)
      );
    }

    if (!response.ok) {
      throw new Error("Server HTTP status: " + response.status);
    }

    if (result.success) {
      showMessage(
        "save-status",
        "Saved successfully. " +
        (result.message || "") +
        (result.row ? " Row: " + result.row : ""),
        false
      );
    } else {
      showMessage(
        "save-status",
        result.message || "Unable to save record.",
        true
      );
    }

  } catch (error) {
    showMessage("save-status", "Save failed: " + error.message, true);
  } finally {
    saving = false;
    $("saveButton").disabled = false;
    $("saveButton").textContent = "Save to Google Sheets";
  }
}

function showMessage(id, message, isError) {
  $(id).textContent = message;
  $(id).className = "message " + (isError ? "error" : "success");
}

/* ---------- NEXT DEVICE ---------- */

async function scanNextDevice() {
  await stopScanner();

  $("imei").value = "";
  $("sim").value = "";
  $("remarks").value = "";

  $("model").value = "BR05 M";
  $("relay").value = "12V";
  $("deviceStatus").value = "In Stock";
  $("simStatusSelect").value = "Active";
  $("lockingStatusSelect").value = "Not locked";

  scanMode = "GPS";
  scanLocked = false;

  $("debug-payload").textContent = "No data yet.";
  $("save-status").className = "message";
  $("save-status").textContent = "";

  $("scannerStatus").textContent =
    "Ready. Start camera and scan GPS QR code.";
}

/* ---------- BUTTONS ---------- */

$("startButton").addEventListener("click", startScanner);
$("stopButton").addEventListener("click", stopScanner);
$("saveButton").addEventListener("click", saveRecord);
$("nextButton").addEventListener("click", scanNextDevice);

/* ---------- INITIALIZE ---------- */

window.addEventListener("load", async () => {
  $("model").value = "BR05 M";
  $("relay").value = "12V";
  $("deviceStatus").value = "In Stock";
  $("simStatusSelect").value = "Active";
  $("lockingStatusSelect").value = "Not locked";

  await loadCameras();

  $("scannerStatus").textContent =
    "Ready. Select camera and tap Start Camera.";
});
</script>
</body>
</html>
