<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>TRAK MOTION GPS - Inventory Scanner</title>

  <!-- QR / Barcode scanner library -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7f9;
      color: #111;
    }

    .header {
      background: #111;
      color: white;
      padding: 18px 16px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 23px;
      letter-spacing: 1px;
    }

    .header p {
      margin: 5px 0 0;
      font-size: 14px;
      color: #bbb;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .step-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .step-number {
      display: inline-flex;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      align-items: center;
      justify-content: center;
      background: #111;
      color: white;
      margin-right: 7px;
      font-size: 14px;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
      background: #000;
    }

    .status {
      padding: 11px;
      border-radius: 8px;
      background: #eef2f4;
      margin-top: 10px;
      font-size: 14px;
    }

    .success {
      background: #e8f8ee;
      color: #116b35;
    }

    .error {
      background: #ffecec;
      color: #a40000;
    }

    .warning {
      background: #fff7df;
      color: #735500;
    }

    label {
      display: block;
      font-weight: bold;
      font-size: 14px;
      margin: 12px 0 6px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      background: white;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    input[readonly] {
      background: #f1f1f1;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 9px;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .primary {
      background: #111;
      color: white;
    }

    .secondary {
      background: #e9ecef;
      color: #111;
    }

    .danger {
      background: #c62828;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .hidden {
      display: none !important;
    }

    .scan-result {
      background: #f5f5f5;
      border-radius: 8px;
      padding: 12px;
      margin-top: 10px;
      word-break: break-word;
      font-size: 14px;
    }

    .record-summary {
      background: #f7f7f7;
      padding: 12px;
      border-radius: 9px;
      line-height: 1.7;
      font-size: 14px;
    }

    .camera-info {
      font-size: 12px;
      color: #666;
      margin-top: 8px;
      word-break: break-all;
    }

    .loading {
      text-align: center;
      padding: 15px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>TRAK MOTION GPS</h1>
    <p>Inventory Scanner</p>
  </div>

  <div class="container">

    <!-- STEP 1 -->
    <div class="card" id="step1Card">

      <div class="step-title">
        <span class="step-number">1</span>
        Scan GPS QR Code
      </div>

      <div id="reader"></div>

      <div id="cameraStatus" class="status">
        Camera is not started.
      </div>

      <div id="cameraInfo" class="camera-info"></div>

      <div id="qrResult" class="scan-result hidden"></div>

      <button
        id="startQrButton"
        class="primary"
        onclick="startQrScanner()"
      >
        Start QR Scanner
      </button>

      <button
        id="stopScannerButton"
        class="secondary hidden"
        onclick="stopScanner()"
      >
        Stop Scanner
      </button>

    </div>


    <!-- STEP 2 -->
    <div class="card hidden" id="step2Card">

      <div class="step-title">
        <span class="step-number">2</span>
        Scan SIM Barcode
      </div>

      <div id="simReader"></div>

      <div id="simStatusMessage" class="status">
        Ready to scan SIM barcode.
      </div>

      <div id="simResult" class="scan-result hidden"></div>

      <button
        id="startSimButton"
        class="primary"
        onclick="startSimScanner()"
      >
        Start SIM Barcode Scanner
      </button>

      <button
        id="stopSimButton"
        class="secondary hidden"
        onclick="stopSimScanner()"
      >
        Stop Scanner
      </button>

    </div>


    <!-- STEP 3 -->
    <div class="card hidden" id="step3Card">

      <div class="step-title">
        <span class="step-number">3</span>
        Review Inventory Record
      </div>

      <label>IMEI No.</label>
      <input
        type="text"
        id="imei"
        readonly
      >

      <label>SIM No.</label>
      <input
        type="text"
        id="sim"
        readonly
      >

      <label>Device Model</label>
      <select id="model">
        <option value="">Select Device Model</option>
        <option value="BR05 M">BR05 M</option>
        <option value="BR05">BR05</option>
        <option value="V5">V5</option>
        <option value="SK05">SK05</option>
        <option value="OTHER">OTHER</option>
      </select>

      <label>Relay</label>
      <select id="relay">
        <option value="">Select Relay</option>
        <option value="12V">12V</option>
        <option value="24V">24V</option>
      </select>

      <label>Status</label>
      <select id="inventoryStatus">
        <option value="">Select Status</option>
        <option value="In Stock">In Stock</option>
        <option value="Delivered">Delivered</option>
        <option value="Installed">Installed</option>
      </select>

      <label>SIM Status</label>
      <select id="simStatus">
        <option value="">Select SIM Status</option>
        <option value="Active">Active</option>
        <option value="Inactive">Inactive</option>
        <option value="Closed">Closed</option>
        <option value="Safe custody">Safe custody</option>
      </select>

      <label>Locking Status</label>
      <select id="lockingStatus">
        <option value="">Select Locking Status</option>
        <option value="locked">locked</option>
        <option value="Not locked">Not locked</option>
      </select>

      <label>Remarks</label>
      <textarea
        id="remarks"
        maxlength="1000"
        placeholder="Optional remarks"
      ></textarea>

      <div id="saveStatus" class="status hidden"></div>

      <button
        id="saveButton"
        class="primary"
        onclick="saveRecord()"
      >
        Save to Google Sheets
      </button>

      <button
        id="nextButton"
        class="secondary hidden"
        onclick="resetForNextDevice()"
      >
        Scan Next Device
      </button>

    </div>

  </div>


<script>

/*******************************************************
 * TRAK MOTION GPS INVENTORY SCANNER
 *******************************************************/


/*
 * YOUR APPS SCRIPT WEB APP URL
 */
const BACKEND_URL =
  "https://script.google.com/macros/s/AKfycbwym184i4Mo9dtZjvbi7UPKCFanL5x-4D4m2yMkp7VOeenjRlzVYj0xPUwPJ5PEALJj/exec";


/*
 * IMPORTANT:
 *
 * Camera 0 means the FIRST camera returned by
 * enumerateDevices().
 *
 * You confirmed that Camera 0 is your desired
 * normal 1x main rear camera.
 */
let selectedCameraId = null;


/*
 * Scanner objects
 */
let qrScanner = null;
let simScanner = null;


/*
 * Prevent multiple successful scans.
 */
let qrScanned = false;
let simScanned = false;


/*
 * Store raw QR information.
 */
let qrRawData = "";


/*******************************************************
 * CAMERA SELECTION
 *******************************************************/

async function getCameraZero() {

  /*
   * First request camera permission.
   *
   * This is important because Android/browser may not
   * reveal camera labels or complete device information
   * before permission is granted.
   */
  const temporaryStream =
    await navigator.mediaDevices.getUserMedia({
      video: true,
      audio: false
    });

  /*
   * Stop the temporary stream immediately.
   */
  temporaryStream
    .getTracks()
    .forEach(track => track.stop());


  /*
   * Get all video cameras.
   */
  const devices =
    await navigator.mediaDevices.enumerateDevices();


  const cameras =
    devices.filter(device =>
      device.kind === "videoinput"
    );


  if (!cameras.length) {
    throw new Error(
      "No camera was detected on this device."
    );
  }


  /*
   * CAMERA 0
   *
   * We deliberately use cameras[0].
   */
  const cameraZero = cameras[0];


  selectedCameraId =
    cameraZero.deviceId;


  /*
   * Show diagnostic information.
   */
  document.getElementById("cameraInfo").innerHTML =
    "Selected Camera 0: " +
    escapeHtml(
      cameraZero.label ||
      "Camera label unavailable"
    ) +
    "<br>Device ID: " +
    escapeHtml(
      cameraZero.deviceId
    );


  return cameraZero.deviceId;
}


/*******************************************************
 * START QR SCANNER
 *******************************************************/

async function startQrScanner() {

  if (qrScanned) {
    return;
  }


  const status =
    document.getElementById("cameraStatus");


  try {

    status.className = "status";
    status.textContent =
      "Selecting Camera 0...";


    /*
     * Get Camera 0.
     */
    const cameraId =
      await getCameraZero();


    status.textContent =
      "Starting Camera 0...";


    /*
     * Create scanner.
     */
    qrScanner =
      new Html5Qrcode("reader");


    /*
     * Start using the EXACT device ID.
     *
     * This is the important change.
     */
    await qrScanner.start(
      {
        deviceId: {
          exact: cameraId
        }
      },
      {
        fps: 10,

        /*
         * Reasonable scanning box.
         */
        qrbox: function(
          viewfinderWidth,
          viewfinderHeight
        ) {

          const size =
            Math.floor(
              Math.min(
                viewfinderWidth,
                viewfinderHeight
              ) * 0.70
            );

          return {
            width: size,
            height: size
          };
        },

        /*
         * Supported QR formats.
         */
        formatsToSupport: [
          Html5QrcodeSupportedFormats.QR_CODE
        ],

        /*
         * Do not mirror rear camera.
         */
        disableFlip: true
      },

      onQrCodeSuccess,

      function(errorMessage) {
        /*
         * Normal scanning errors are ignored.
         */
      }
    );


    status.className =
      "status success";

    status.textContent =
      "Camera 0 is active. Scan the GPS QR code.";


    document
      .getElementById("startQrButton")
      .classList.add("hidden");


    document
      .getElementById("stopScannerButton")
      .classList.remove("hidden");


  } catch (error) {

    console.error(error);

    status.className =
      "status error";

    status.innerHTML =
      "<b>Camera error:</b><br>" +
      escapeHtml(
        error.message ||
        String(error)
      );

  }

}


/*******************************************************
 * QR SUCCESS
 *******************************************************/

async function onQrCodeSuccess(decodedText) {

  if (qrScanned) {
    return;
  }


  qrScanned = true;


  qrRawData =
    String(decodedText || "").trim();


  /*
   * Stop QR scanner immediately.
   */
  await stopScanner();


  /*
   * Parse QR.
   */
  const parsed =
    parseGpsQr(qrRawData);


  /*
   * IMEI
   */
  document.getElementById("imei").value =
    parsed.imei || "";


  /*
   * Device model if found in QR.
   */
  if (parsed.model) {

    const modelSelect =
      document.getElementById("model");

    const exists =
      Array.from(
        modelSelect.options
      ).some(
        option =>
          option.value === parsed.model
      );

    if (exists) {
      modelSelect.value =
        parsed.model;
    }
  }


  /*
   * Show result.
   */
  const qrResult =
    document.getElementById("qrResult");

  qrResult.classList.remove("hidden");

  qrResult.innerHTML =
    "<b>QR scanned successfully.</b><br>" +
    "IMEI: " +
    escapeHtml(
      parsed.imei ||
      "Not detected"
    ) +
    "<br>" +
    "Model: " +
    escapeHtml(
      parsed.model ||
      "Not detected"
    );


  /*
   * IMEI is mandatory.
   */
  if (!parsed.imei) {

    qrScanned = false;

    qrResult.innerHTML +=
      "<br><br><span style='color:#a40000'>" +
      "<b>IMEI could not be detected.</b>" +
      "<br>Please scan the GPS QR code again." +
      "</span>";

    document
      .getElementById("cameraStatus")
      .className =
      "status error";

    document
      .getElementById("cameraStatus")
      .textContent =
      "QR scanned, but IMEI was not detected.";

    document
      .getElementById("startQrButton")
      .classList.remove("hidden");

    return;
  }


  /*
   * Move to Step 2.
   */
  document
    .getElementById("step2Card")
    .classList.remove("hidden");


  document
    .getElementById("simStatusMessage")
    .className =
    "status success";

  document
    .getElementById("simStatusMessage")
    .textContent =
    "GPS QR captured. Now scan the SIM barcode.";


  /*
   * Automatically start SIM scanner.
   */
  setTimeout(
    startSimScanner,
    300
  );

}


/*******************************************************
 * QR PARSER
 *******************************************************/

function parseGpsQr(text) {

  const result = {
    imei: "",
    model: ""
  };


  const cleanText =
    String(text || "").trim();


  /*
   * Try JSON first.
   */
  try {

    const json =
      JSON.parse(cleanText);


    if (json) {

      result.imei =
        normalizeImei(
          json.imei ||
          json.IMEI ||
          json.imeiNo ||
          json.IMEI_No ||
          ""
        );


      result.model =
        String(
          json.model ||
          json.deviceModel ||
          json.Model ||
          ""
        ).trim();

    }

  } catch (e) {
    /*
     * QR is not JSON.
     */
  }


  /*
   * If JSON did not provide IMEI,
   * search the entire QR text.
   */
  if (!result.imei) {

    const imeiMatch =
      cleanText.match(
        /\b\d{14,16}\b/
      );

    if (imeiMatch) {

      result.imei =
        normalizeImei(
          imeiMatch[0]
        );

    }
  }


  /*
   * Known device models.
   */
  if (!result.model) {

    const models = [
      "BR05 M",
      "BR05",
      "V5",
      "SK05"
    ];


    for (
      let i = 0;
      i < models.length;
      i++
    ) {

      if (
        cleanText
          .toUpperCase()
          .includes(
            models[i].toUpperCase()
          )
      ) {

        result.model =
          models[i];

        break;
      }
    }
  }


  return result;
}


/*******************************************************
 * START SIM BARCODE SCANNER
 *******************************************************/

async function startSimScanner() {

  if (simScanned) {
    return;
  }


  const status =
    document.getElementById(
      "simStatusMessage"
    );


  try {

    status.className =
      "status";

    status.textContent =
      "Starting Camera 0 for SIM barcode...";


    /*
     * Make sure Camera 0 is selected.
     */
    const cameraId =
      selectedCameraId ||
      await getCameraZero();


    simScanner =
      new Html5Qrcode("simReader");


    await simScanner.start(
      {
        deviceId: {
          exact: cameraId
        }
      },
      {
        fps: 10,

        qrbox: function(
          viewfinderWidth,
          viewfinderHeight
        ) {

          const width =
            Math.floor(
              viewfinderWidth * 0.85
            );

          const height =
            Math.floor(
              Math.min(
                viewfinderHeight * 0.30,
                180
              )
            );

          return {
            width: width,
            height: height
          };
        },

        formatsToSupport: [
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.CODE_93,
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.UPC_E
        ],

        disableFlip: true
      },

      onSimBarcodeSuccess,

      function(errorMessage) {
        /*
         * Normal scanning errors are ignored.
         */
      }
    );


    status.className =
      "status success";

    status.textContent =
      "Camera 0 is active. Scan the SIM barcode.";


    document
      .getElementById("startSimButton")
      .classList.add("hidden");


    document
      .getElementById("stopSimButton")
      .classList.remove("hidden");


  } catch (error) {

    console.error(error);

    status.className =
      "status error";

    status.innerHTML =
      "<b>SIM camera error:</b><br>" +
      escapeHtml(
        error.message ||
        String(error)
      );

  }

}


/*******************************************************
 * SIM BARCODE SUCCESS
 *******************************************************/

async function onSimBarcodeSuccess(decodedText) {

  if (simScanned) {
    return;
  }


  simScanned = true;


  const sim =
    String(decodedText || "").trim();


  await stopSimScanner();


  document.getElementById("sim").value =
    sim;


  const simResult =
    document.getElementById("simResult");


  simResult.classList.remove("hidden");

  simResult.innerHTML =
    "<b>SIM barcode scanned successfully.</b><br>" +
    "SIM No.: " +
    escapeHtml(sim);


  document
    .getElementById("simStatusMessage")
    .className =
    "status success";

  document
    .getElementById("simStatusMessage")
    .textContent =
    "SIM captured successfully.";


  /*
   * Show Step 3.
   */
  document
    .getElementById("step3Card")
    .classList.remove("hidden");


  /*
   * Scroll to review section.
   */
  document
    .getElementById("step3Card")
    .scrollIntoView({
      behavior: "smooth"
    });


  /*
   * If model was not detected from QR,
   * user can select it manually.
   */
}


/*******************************************************
 * STOP QR SCANNER
 *******************************************************/

async function stopScanner() {

  if (!qrScanner) {
    return;
  }


  try {

    if (
      qrScanner.getState &&
      qrScanner.getState() !==
      Html5QrcodeScannerState.NOT_STARTED
    ) {
      await qrScanner.stop();
    }

  } catch (error) {

    console.log(
      "QR scanner stop:",
      error
    );

  }


  try {

    qrScanner.clear();

  } catch (error) {

    console.log(
      "QR scanner clear:",
      error
    );

  }


  qrScanner = null;


  document
    .getElementById("stopScannerButton")
    .classList.add("hidden");

}


/*******************************************************
 * STOP SIM SCANNER
 *******************************************************/

async function stopSimScanner() {

  if (!simScanner) {
    return;
  }


  try {

    if (
      simScanner.getState &&
      simScanner.getState() !==
      Html5QrcodeScannerState.NOT_STARTED
    ) {
      await simScanner.stop();
    }

  } catch (error) {

    console.log(
      "SIM scanner stop:",
      error
    );

  }


  try {

    simScanner.clear();

  } catch (error) {

    console.log(
      "SIM scanner clear:",
      error
    );

  }


  simScanner = null;


  document
    .getElementById("stopSimButton")
    .classList.add("hidden");

}


/*******************************************************
 * SAVE INVENTORY RECORD
 *******************************************************/

async function saveRecord() {

  const saveButton =
    document.getElementById(
      "saveButton"
    );

  const saveStatus =
    document.getElementById(
      "saveStatus"
    );


  /*
   * Collect data.
   */
  const record = {

    imei:
      document
        .getElementById("imei")
        .value
        .trim(),

    sim:
      document
        .getElementById("sim")
        .value
        .trim(),

    model:
      document
        .getElementById("model")
        .value
        .trim(),

    relay:
      document
        .getElementById("relay")
        .value
        .trim(),

    status:
      document
        .getElementById("inventoryStatus")
        .value
        .trim(),

    simStatus:
      document
        .getElementById("simStatus")
        .value
        .trim(),

    lockingStatus:
      document
        .getElementById("lockingStatus")
        .value
        .trim(),

    remarks:
      document
        .getElementById("remarks")
        .value
        .trim()
  };


  /*
   * Client-side validation.
   */
  if (!record.imei) {

    showSaveError(
      "IMEI number is missing."
    );

    return;
  }


  if (!/^\d{14,16}$/.test(record.imei)) {

    showSaveError(
      "IMEI must contain 14 to 16 digits."
    );

    return;
  }


  if (!record.sim) {

    showSaveError(
      "SIM number is missing."
    );

    return;
  }


  if (!record.model) {

    showSaveError(
      "Please select Device Model."
    );

    return;
  }


  if (!record.relay) {

    showSaveError(
      "Please select Relay."
    );

    return;
  }


  if (!record.status) {

    showSaveError(
      "Please select Status."
    );

    return;
  }


  if (!record.simStatus) {

    showSaveError(
      "Please select SIM Status."
    );

    return;
  }


  if (!record.lockingStatus) {

    showSaveError(
      "Please select Locking Status."
    );

    return;
  }


  /*
   * Disable button while saving.
   */
  saveButton.disabled = true;

  saveButton.textContent =
    "Saving...";


  saveStatus.className =
    "status";

  saveStatus.classList.remove(
    "hidden"
  );

  saveStatus.textContent =
    "Saving inventory record...";


  try {

    /*
     * IMPORTANT:
     *
     * text/plain prevents the browser from sending
     * a CORS preflight request to Apps Script.
     */
    const response =
      await fetch(
        BACKEND_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify(record)
        }
      );


    const responseText =
      await response.text();


    let result;


    try {

      result =
        JSON.parse(responseText);

    } catch (parseError) {

      throw new Error(
        "Server returned an unexpected response."
      );
    }


    if (
      !response.ok ||
      !result.success
    ) {

      throw new Error(
        result.message ||
        "Inventory record could not be saved."
      );
    }


    /*
     * SUCCESS
     */
    saveStatus.className =
      "status success";

    saveStatus.innerHTML =
      "<b>Saved successfully.</b><br>" +
      "Google Sheets Row: " +
      escapeHtml(
        String(result.row || "")
      );


    saveButton.classList.add(
      "hidden"
    );


    document
      .getElementById("nextButton")
      .classList.remove("hidden");


    /*
     * Disable editing after successful save.
     */
    disableRecordFields(true);


  } catch (error) {

    console.error(error);


    /*
     * IMPORTANT:
     *
     * We DO NOT clear any fields if saving fails.
     * The scanned record remains on screen.
     */
    saveStatus.className =
      "status error";

    saveStatus.innerHTML =
      "<b>Save failed.</b><br>" +
      escapeHtml(
        error.message ||
        String(error)
      ) +
      "<br><br>" +
      "Your scanned data is still محفوظ on this screen. " +
      "Check the connection/backend and try Save again.";


    saveButton.disabled = false;

    saveButton.textContent =
      "Save to Google Sheets";
  }

}


/*******************************************************
 * SAVE ERROR
 *******************************************************/

function showSaveError(message) {

  const saveStatus =
    document.getElementById(
      "saveStatus"
    );

  saveStatus.className =
    "status error";

  saveStatus.classList.remove(
    "hidden"
  );

  saveStatus.textContent =
    message;
}


/*******************************************************
 * DISABLE FIELDS AFTER SUCCESS
 *******************************************************/

function disableRecordFields(disabled) {

  document
    .getElementById("model")
    .disabled = disabled;

  document
    .getElementById("relay")
    .disabled = disabled;

  document
    .getElementById("inventoryStatus")
    .disabled = disabled;

  document
    .getElementById("simStatus")
    .disabled = disabled;

  document
    .getElementById("lockingStatus")
    .disabled = disabled;

  document
    .getElementById("remarks")
    .disabled = disabled;
}


/*******************************************************
 * RESET FOR NEXT DEVICE
 *******************************************************/

async function resetForNextDevice() {

  await stopScanner();

  await stopSimScanner();


  qrScanned = false;
  simScanned = false;

  qrRawData = "";


  selectedCameraId = null;


  /*
   * Clear record.
   */
  document
    .getElementById("imei")
    .value = "";

  document
    .getElementById("sim")
    .value = "";

  document
    .getElementById("model")
    .value = "";

  document
    .getElementById("relay")
    .value = "";

  document
    .getElementById("inventoryStatus")
    .value = "";

  document
    .getElementById("simStatus")
    .value = "";

  document
    .getElementById("lockingStatus")
    .value = "";

  document
    .getElementById("remarks")
    .value = "";


  /*
   * Clear messages.
   */
  document
    .getElementById("qrResult")
    .classList.add("hidden");

  document
    .getElementById("simResult")
    .classList.add("hidden");


  document
    .getElementById("cameraInfo")
    .innerHTML = "";


  document
    .getElementById("cameraStatus")
    .className =
    "status";

  document
    .getElementById("cameraStatus")
    .textContent =
    "Ready for next GPS device.";


  document
    .getElementById("simStatusMessage")
    .className =
    "status";

  document
    .getElementById("simStatusMessage")
    .textContent =
    "Ready to scan SIM barcode.";


  const saveStatus =
    document.getElementById(
      "saveStatus"
    );

  saveStatus.classList.add(
    "hidden"
  );


  /*
   * Re-enable fields.
   */
  disableRecordFields(false);


  /*
   * Buttons.
   */
  const saveButton =
    document.getElementById(
      "saveButton"
    );

  saveButton.classList.remove(
    "hidden"
  );

  saveButton.disabled = false;

  saveButton.textContent =
    "Save to Google Sheets";


  document
    .getElementById("nextButton")
    .classList.add("hidden");


  /*
   * Hide Step 3.
   */
  document
    .getElementById("step3Card")
    .classList.add("hidden");


  /*
   * Hide Step 2.
   */
  document
    .getElementById("step2Card")
    .classList.add("hidden");


  /*
   * Show Start QR button.
   */
  document
    .getElementById("startQrButton")
    .classList.remove("hidden");


  /*
   * Scroll to top.
   */
  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });


  /*
   * Automatically start Camera 0 again.
   */
  setTimeout(
    startQrScanner,
    400
  );
}


/*******************************************************
 * NORMALIZE IMEI
 *******************************************************/

function normalizeImei(value) {

  return String(
    value || ""
  )
    .trim()
    .replace(/[\s-]/g, "");
}


/*******************************************************
 * HTML ESCAPE
 *******************************************************/

function escapeHtml(value) {

  return String(
    value === null ||
    value === undefined
      ? ""
      : value
  )
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/*******************************************************
 * INITIAL MESSAGE
 *******************************************************/

window.addEventListener(
  "load",
  function() {

    document

      .textContent =

  }
);
