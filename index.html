<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TRAK MOTION GPS Inventory Scanner</title>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:15px;
  font-family:Arial,sans-serif;
  background:#f1f5f3;
  color:#17221c;
}

.container{
  max-width:650px;
  margin:auto;
}

.header{
  background:#0b7a43;
  color:white;
  padding:20px;
  border-radius:16px;
  text-align:center;
  margin-bottom:15px;
  box-shadow:0 4px 12px rgba(0,0,0,.12);
}

.header h1{
  margin:0;
  font-size:24px;
}

.header p{
  margin:7px 0 0;
  font-size:14px;
}

.card{
  background:white;
  padding:18px;
  border-radius:16px;
  margin-bottom:15px;
  box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.card h2{
  margin-top:0;
  font-size:18px;
}

label{
  display:block;
  font-weight:bold;
  margin-top:14px;
  margin-bottom:6px;
}

input,
select,
textarea,
button{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #cfd8d2;
  font-size:16px;
}

input:focus,
select:focus,
textarea:focus{
  outline:none;
  border-color:#0b7a43;
}

textarea{
  min-height:80px;
  resize:vertical;
}

button{
  border:none;
  cursor:pointer;
  font-weight:bold;
  margin-top:10px;
}

.primary{
  background:#0b7a43;
  color:white;
}

.secondary{
  background:#e8f3ed;
  color:#07552f;
}

.danger{
  background:#ffe8e8;
  color:#a40000;
}

.scanner-box{
  width:100%;
  min-height:250px;
  border:2px dashed #0b7a43;
  border-radius:14px;
  overflow:hidden;
  background:#fafafa;
}

.scan-status{
  margin-top:8px;
  padding:10px;
  background:#f2f5f3;
  border-radius:9px;
  font-size:14px;
}

.message{
  margin-top:10px;
  padding:12px;
  border-radius:10px;
  display:none;
  font-weight:bold;
}

.success{
  display:block;
  background:#e4f7eb;
  color:#08602f;
}

.error{
  display:block;
  background:#ffe7e7;
  color:#a00000;
}

.debug{
  background:#101714;
  color:#9cffc1;
  padding:12px;
  border-radius:10px;
  font-family:monospace;
  font-size:12px;
  white-space:pre-wrap;
  word-break:break-word;
  overflow:auto;
}

.small{
  font-size:12px;
  color:#66736b;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

@media(max-width:500px){
  .row{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>TRAK MOTION GPS</h1>
    <p>Inventory Scanner</p>
  </div>


  <!-- CAMERA -->
  <div class="card">

    <h2>📷 Scanner</h2>

    <label>Camera / Lens</label>

    <select id="cameraSelect">
      <option value="">Select Camera</option>
    </select>

    <div
      id="scanner"
      class="scanner-box">
    </div>

    <div
      id="scannerStatus"
      class="scan-status">
      Camera not started.
    </div>

    <button
      id="startCameraButton"
      class="primary"
      onclick="startScanner()">
      Start Camera
    </button>

    <button
      class="secondary"
      onclick="stopScanner()">
      Stop Camera
    </button>

  </div>


  <!-- GPS DEVICE -->
  <div class="card">

    <h2>📡 GPS Device</h2>

    <label for="imei">
      IMEI Number
    </label>

    <input
      id="imei"
      type="text"
      inputmode="numeric"
      autocomplete="off"
      placeholder="Scan GPS QR code">

    <div class="small">
      Scan the square QR code on the GPS device.
    </div>

  </div>


  <!-- SIM -->
  <div class="card">

    <h2>📱 SIM</h2>

    <label for="sim">
      SIM Number
    </label>

    <input
      id="sim"
      type="text"
      autocomplete="off"
      placeholder="Scan SIM barcode">

    <div class="small">
      Scan the traditional barcode after scanning the GPS QR.
    </div>

  </div>


  <!-- DEVICE DETAILS -->
  <div class="card">

    <h2>⚙️ Device Details</h2>

    <label for="model">
      Device Model
    </label>

    <select id="model">
      <option value="BR05 M">BR05 M</option>
      <option value="BR05">BR05</option>
      <option value="V5">V5</option>
      <option value="SK05">SK05</option>
      <option value="OTHER">OTHER</option>
    </select>


    <label for="relay">
      Relay
    </label>

    <select id="relay">
      <option value="12V">12V</option>
      <option value="24V">24V</option>
    </select>


    <label for="deviceStatus">
      Device Status
    </label>

    <select id="deviceStatus">
      <option value="In Stock">In Stock</option>
      <option value="Delivered">Delivered</option>
      <option value="Installed">Installed</option>
    </select>


    <!-- IMPORTANT:
         This uses a UNIQUE ID.
         It avoids the previous SIM Status ID problem.
    -->

    <label for="simStatusSelect">
      SIM Status
    </label>

    <select id="simStatusSelect">
      <option value="Active">Active</option>
      <option value="Inactive">Inactive</option>
      <option value="Closed">Closed</option>
      <option value="Safe custody">Safe custody</option>
    </select>


    <label for="lockingStatusSelect">
      Locking Status
    </label>

    <select id="lockingStatusSelect">
      <option value="Not locked">Not locked</option>
      <option value="locked">locked</option>
    </select>


    <label for="remarks">
      Remarks
    </label>

    <textarea
      id="remarks"
      placeholder="Optional remarks"></textarea>

  </div>


  <!-- SAVE -->
  <div class="card">

    <h2>💾 Save Inventory</h2>

    <button
      id="saveButton"
      class="primary"
      onclick="saveRecord()">
      Save to Google Sheets
    </button>

    <button
      class="secondary"
      onclick="scanNextDevice()">
      Scan Next Device
    </button>

    <div
      id="save-status"
      class="message">
    </div>

  </div>


  <!-- DEBUG -->
  <div class="card">

    <h2>🔍 Debug Payload</h2>

    <div
      id="debug-payload"
      class="debug">
      No data yet.
    </div>

  </div>

</div>


<script>

/* =========================================================
   CONFIGURATION
   ========================================================= */

const BACKEND_URL =
"https://script.google.com/macros/s/AKfycbwym184i4Mo9dtZjvbi7UPKCFanL5x-4D4m2yMkp7VOeenjRlzVYj0xPUwPJ5PEALJj/exec";


/* =========================================================
   GLOBAL VARIABLES
   ========================================================= */

let scanner = null;

let selectedCameraId = "";

let scannerRunning = false;

let currentScanMode = "GPS";

let saving = false;


/* =========================================================
   SHORT DOM HELPER
   ========================================================= */

function $(id){
  return document.getElementById(id);
}


/* =========================================================
   MESSAGE
   ========================================================= */

function msg(id, text, isError){

  const el = $(id);

  if(!el){
    return;
  }

  el.textContent = text;

  el.className =
    "message " +
    (isError ? "error" : "success");

}


/* =========================================================
   CAMERA LIST
   ========================================================= */

async function loadCameras(){

  try{

    const cameras =
      await Html5Qrcode.getCameras();

    const select =
      $("cameraSelect");

    select.innerHTML =
      '<option value="">Select Camera</option>';

    if(!cameras || cameras.length === 0){

      $("scannerStatus").textContent =
        "No camera found.";

      return;
    }

    cameras.forEach((camera,index)=>{

      const option =
        document.createElement("option");

      option.value =
        camera.id;

      option.textContent =
        camera.label ||
        ("Camera " + (index + 1));

      select.appendChild(option);

    });

    /*
      Try to select the rear camera.
    */

    const rear =
      cameras.find(camera =>
        /back|rear|environment/i
        .test(camera.label || "")
      );

    if(rear){

      select.value =
        rear.id;

      selectedCameraId =
        rear.id;

    }
    else{

      select.value =
        cameras[0].id;

      selectedCameraId =
        cameras[0].id;

    }

  }
  catch(error){

    $("scannerStatus").textContent =
      "Camera permission/error: " +
      error.message;

  }

}


/* =========================================================
   CAMERA CHANGE
   ========================================================= */

$("cameraSelect").addEventListener(
  "change",
  async function(){

    selectedCameraId =
      this.value;

    if(scannerRunning){

      await stopScanner();

      await startScanner();

    }

  }
);


/* =========================================================
   START SCANNER
   ========================================================= */

async function startScanner(){

  if(scannerRunning){
    return;
  }

  if(!selectedCameraId){

    await loadCameras();

  }

  if(!selectedCameraId){

    $("scannerStatus").textContent =
      "Please select a camera.";

    return;

  }

  try{

    scanner =
      new Html5Qrcode("scanner");

    scannerRunning =
      true;

    $("scannerStatus").textContent =
      "Scanning " +
      (currentScanMode === "GPS"
        ? "GPS QR code..."
        : "SIM barcode...");


    const formatsToScan =
      currentScanMode === "GPS"
        ? [
            Html5QrcodeSupportedFormats.QR_CODE
          ]
        : [
            Html5QrcodeSupportedFormats.CODE_128,
            Html5QrcodeSupportedFormats.CODE_39,
            Html5QrcodeSupportedFormats.CODE_93,
            Html5QrcodeSupportedFormats.EAN_13,
            Html5QrcodeSupportedFormats.EAN_8,
            Html5QrcodeSupportedFormats.ITF,
            Html5QrcodeSupportedFormats.UPC_A,
            Html5QrcodeSupportedFormats.UPC_E
          ];


    await scanner.start(

      selectedCameraId,

      {
        fps:10,

        qrbox:{
          width:250,
          height:250
        },

        formatsToSupport:
          formatsToScan

      },

      function(decodedText){

        handleScan(decodedText);

      },

      function(errorMessage){

        /*
          Ignore normal scan failures.
        */

      }

    );

  }
  catch(error){

    scannerRunning =
      false;

    $("scannerStatus").textContent =
      "Scanner error: " +
      error.message;

  }

}


/* =========================================================
   STOP SCANNER
   ========================================================= */

async function stopScanner(){

  if(!scanner){
    scannerRunning =
      false;
    return;
  }

  try{

    if(scannerRunning){

      await scanner.stop();

    }

    await scanner.clear();

  }
  catch(error){

    console.log(error);

  }

  scanner =
    null;

  scannerRunning =
    false;

  $("scannerStatus").textContent =
    "Camera stopped.";

}


/* =========================================================
   HANDLE SCAN
   ========================================================= */

async function handleScan(decodedText){

  const value =
    String(decodedText || "").trim();

  if(!value){
    return;
  }


  if(currentScanMode === "GPS"){

    /*
      GPS QR SCAN
    */

    const imei =
      extractImei(value);

    if(!imei){

      $("scannerStatus").textContent =
        "QR scanned, but IMEI was not found.";

      return;

    }

    $("imei").value =
      imei;


    $("scannerStatus").textContent =
      "GPS QR scanned successfully. Now scan SIM barcode.";


    currentScanMode =
      "SIM";


    await stopScanner();


    /*
      Automatically restart scanner
      for SIM barcode.
    */

    setTimeout(
      startScanner,
      300
    );

  }
  else{

    /*
      SIM BARCODE SCAN
    */

    $("sim").value =
      value;


    $("scannerStatus").textContent =
      "SIM barcode scanned successfully.";

    await stopScanner();

  }

}


/* =========================================================
   EXTRACT IMEI
   ========================================================= */

function extractImei(text){

  /*
    First look for a normal 14-16 digit number.
  */

  const matches =
    text.match(/\d{14,16}/g);

  if(matches && matches.length){

    return matches[0];

  }


  /*
    Look for common labels.
  */

  const match =
    text.match(
      /IMEI\s*[:=]?\s*([0-9]{14,16})/i
    );

  if(match){

    return match[1];

  }

  return "";

}


/* =========================================================
   GET RECORD
   ========================================================= */

function getRecord(){

  /*
    IMPORTANT FIX:
    SIM Status now uses a completely new unique ID.
  */

  const imeiElement =
    document.getElementById("imei");

  const simElement =
    document.getElementById("sim");

  const modelElement =
    document.getElementById("model");

  const relayElement =
    document.getElementById("relay");

  const statusElement =
    document.getElementById("deviceStatus");

  const simStatusElement =
    document.getElementById("simStatusSelect");

  const lockingElement =
    document.getElementById("lockingStatusSelect");

  const remarksElement =
    document.getElementById("remarks");


  /*
    Safety check.
  */

  if(!simStatusElement){

    alert(
      "ERROR: SIM Status dropdown was not found."
    );

    throw new Error(
      "SIM Status dropdown not found."
    );

  }


  const record = {

    imei:
      imeiElement.value.trim(),

    sim:
      simElement.value.trim(),

    model:
      modelElement.value,

    relay:
      relayElement.value,

    status:
      statusElement.value,

    simStatus:
      simStatusElement.value,

    lockingStatus:
      lockingElement.value,

    remarks:
      remarksElement.value.trim()

  };


  return record;

}


/* =========================================================
   DEBUG
   ========================================================= */

function showDebug(record){

  $("debug-payload").textContent =
    JSON.stringify(
      record,
      null,
      2
    );

}


/* =========================================================
   VALIDATE RECORD
   ========================================================= */

function validateRecord(record){

  if(!record.imei){

    return "IMEI Number is required.";

  }

  if(!/^\d{14,16}$/.test(record.imei)){

    return
      "IMEI must contain 14 to 16 digits.";

  }


  if(!record.sim){

    return "SIM Number is required.";

  }


  if(!record.model){

    return "Device Model is required.";

  }


  if(!record.relay){

    return "Relay is required.";

  }


  if(!record.status){

    return "Device Status is required.";

  }


  if(!record.simStatus){

    return "SIM Status is required.";

  }


  if(!record.lockingStatus){

    return "Locking Status is required.";

  }


  return "";

}


/* =========================================================
   SAVE RECORD
   ========================================================= */

async function saveRecord(){

  if(saving){

    return;

  }

  saving =
    true;

  $("saveButton").disabled =
    true;

  $("saveButton").textContent =
    "Saving...";


  try{

    const record =
      getRecord();


    /*
      Show EXACT payload before sending.
    */

    showDebug(record);


    const error =
      validateRecord(record);


    if(error){

      msg(
        "save-status",
        error,
        true
      );

      return;

    }


    /*
      Extra SIM Status protection.
    */

    const allowedSimStatus = [
      "Active",
      "Inactive",
      "Closed",
      "Safe custody"
    ];


    if(
      !allowedSimStatus.includes(
        record.simStatus
      )
    ){

      msg(
        "save-status",
        "Invalid SIM Status: [" +
        record.simStatus +
        "]",
        true
      );

      return;

    }


    /*
      Send to Google Apps Script.
    */

    const response =
      await fetch(
        BACKEND_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify(record)
        }
      );


    const responseText =
      await response.text();


    let result;

    try{

      result =
        JSON.parse(responseText);

    }
    catch(error){

      throw new Error(
        "Server returned invalid response: " +
        responseText
      );

    }


    if(result.success){

      msg(
        "save-status",
        "✅ " +
        result.message +
        " Row: " +
        result.row,
        false
      );

    }
    else{

      msg(
        "save-status",
        "❌ " +
        (result.message ||
         "Unable to save record."),
        true
      );

    }

  }
  catch(error){

    msg(
      "save-status",
      "❌ " +
      error.message,
      true
    );

  }
  finally{

    saving =
      false;

    $("saveButton").disabled =
      false;

    $("saveButton").textContent =
      "Save to Google Sheets";

  }

}


/* =========================================================
   SCAN NEXT DEVICE
   ========================================================= */

async function scanNextDevice(){

  await stopScanner();


  /*
    Clear previous device.
  */

  $("imei").value =
    "";

  $("sim").value =
    "";

  $("remarks").value =
    "";


  /*
    Reset dropdowns.
  */

  $("model").value =
    "BR05 M";

  $("relay").value =
    "12V";

  $("deviceStatus").value =
    "In Stock";

  $("simStatusSelect").value =
    "Active";

  $("lockingStatusSelect").value =
    "Not locked";


  /*
    Reset scanner mode.
  */

  currentScanMode =
    "GPS";


  $("debug-payload").textContent =
    "No data yet.";


  $("save-status").className =
    "message";

  $("save-status").textContent =
    "";


  $("scannerStatus").textContent =
    "Ready. Start camera and scan GPS QR code.";

}


/* =========================================================
   INITIALIZATION
   ========================================================= */

window.addEventListener(
  "load",
  async function(){

    /*
      Set default values.
    */

    $("model").value =
      "BR05 M";

    $("relay").value =
      "12V";

    $("deviceStatus").value =
      "In Stock";

    $("simStatusSelect").value =
      "Active";

    $("lockingStatusSelect").value =
      "Not locked";


    /*
      Load available cameras.
    */

    await loadCameras();


    $("scannerStatus").textContent =
      "Ready. Select camera and tap Start Camera.";

  }
);

</script>

</body>
</html>
